spring:
  application:
    name: invest-mate-ai

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/invest_ai_local
    username: invest_ai
    password: Investai12!@

mybatis:
  ## mapper 파일 경로
  mapper-locations: classpath:/mapper/**/*.xml
  ## vo 파일 경로
  type-aliases-package: com.example.invest_mate_ai
  configuration:
    map-underscore-to-camel-case: true

logging:
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss.SSS}] %-5level %logger{36} - %msg%n"
  level:
    com.example.invest_mate_ai: DEBUG

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID}
    client-secret: ${GOOGLE_CLIENT_SECRET}
    redirect-uri: http://localhost:8080/auth/oauth2/google/callback
    google-auth-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-api-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

  kakao:
    client-id: ${KAKAO_CLIENT_ID}
    client-secret: ${KAKAO_CLIENT_SECRET}
    redirect-uri: http://localhost:8080/auth/oauth2/kakao/callback
    auth-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me

  naver:
    client-id: ${NAVER_CLIENT_ID}
    client-secret: ${NAVER_CLIENT_SECRET}
    redirect-uri: http://localhost:8080/auth/oauth2/naver/callback
    auth-uri: https://nid.naver.com/oauth2.0/authorize
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me

stock:
  api:
    naver:
      client-id: ${NAVER_SEARCH_CLIENT_ID:}
      client-secret: ${NAVER_SEARCH_CLIENT_SECRET:}
      news-uri: https://openapi.naver.com/v1/search/news.json
    dart:
      api-key: ${DART_API_KEY:}
      base-uri: https://opendart.fss.or.kr/api


